<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!--slide content style-->
    <style>
        #panel,
        #flip {
            padding: 5px;
            text-align: center;
            background-color: #e5eecc;
            border: solid 1px #c3c3c3;
        }

        #panel {
            padding: 50px;
            display: none;
        }
    </style>
</head>

<body>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
     <!--jquery animate-->
    <div id="divAnimate" style="position:relative; width:80px;height:80px;background-color:blue;"></div>

    <p id="demo1">hello</p>
    <button id="btnChain">Click</button>
    <p id="demo2">how are you</p>
    <button id="hide">hide</button>
    <button id="show">show</button>
    <button id="toggle">toggle</button>
    <br>
    <br>
    <!--fade-in/fade-out/fade-toggle-->
    <button id="btnFadeIn"> fade in </button>
    <button id="btnFadeOut"> fade out </button>
    <button id="btnFadeToggle"> fade toggle </button><br><br>

    <div id="div1" style="width:80px;height:80px;display:none;background-color:red;"></div><br>
    <div id="div2" style="width:80px;height:80px;display:none;background-color:green;"></div><br>
    <div id="div3" style="width:80px;height:80px;display:none;background-color:blue;"></div>

    <br><br>
    <!-- jquery efffect slide-->
    <button id="stop">stop slide</button>
    <div id="flip">Click to slide panel</div>
    <div id="panel">Hello world!</div>
    <br><br>

   
    <script>
        $(document).ready(function () {
            //show-hide effect
            $("#hide").click(function () {
                $("p").hide();
            });
            $("#show").click(function () {
                $("p").show();
            });
            $("#toggle").click(function () {
                $("p").toggle();
            });

            //fade-in/fade-out/fade-toggle
            $("#btnFadeIn").click(function () {
                $("#div1").fadeIn();
                $("#div2").fadeIn("slow");
                $("#div3").fadeIn(3000);
            });
            $("#btnFadeOut").click(function () {
                $("#div1").fadeOut();
                $("#div2").fadeOut("slow");
                $("#div3").fadeOut(3000);
            });
            $("#btnFadeToggle").click(function () {
                $("#div1").fadeToggle();
                $("#div2").fadeToggle("slow");
                $("#div3").fadeToggle(3000);

            });
            //jquery efffect slide
              $("#flip").click(function(){
                 $("#panel").slideDown(5000);
              });  
            /* $("#flip").click(function () {
                $("#panel").slideToggle(5000);
            });  */
            $("#stop").click(function () {
                $("#panel").stop();
            });
            //animate
            $("#divAnimate").click(function () {
                $(this).animate({
                    left: '450px',
                    top: '350px'
                }, 1000);
            });
            //jquery chaining
            $("#btnChain").click(function(){
                $("#demo1").css("color","red").slideUp(2000).slideDown(2000);
            })
        });

    </script>

</body>

</html>
