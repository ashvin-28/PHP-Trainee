<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <div id="ajaxExp">

        <button id="btn" onclick="loadData()">Change content</button>
    </div>
    <p id="headerInfo"></p>
    <script>
        function loadData() {
            let xttp = new XMLHttpRequest();
            xttp.onreadystatechange = function () {
                if (this.readyState == 4 && this.status == 200) {
                    $("#ajaxExp").html(this.responseText);
                  $("p").html(this.getAllResponseHeaders());
                   // $("p").html(this.getResponseHeader("Last-Modified"));
                }
            };
            // xttp.open("GET","ajaxInfo.txt",true);
            xttp.open("GET", "getInfo.php?name=Ashvin&age=21");
            xttp.send();
        }
    </script>
</body>

</html>
