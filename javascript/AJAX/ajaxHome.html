            console.log("loadData function called");
            $.ajax({
                url: 'getInfo.php',
                type: "GET",
                data: { name: "Ashvin", age: 21 },
                dataType: 'text',
                success: function (response) {
                    console.log("AJAX success:", response);
                    $("#ajaxExp").html(response);
                },
                error: function () {
                    console.error("AJAX error:");
                    $("#ajaxExp").html("Error loading data.");
                }
            });
        }
    </script>
