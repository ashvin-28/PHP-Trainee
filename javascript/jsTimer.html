<!DOCTYPE html>
<html>
<body>


<p id="demo"></p>

<button onclick="clearInterval(myVar)">Stop time</button>
<button onclick="start()">Start time</button>

<script>

let myVar;
function myTimer() {
  const d = new Date();
  document.getElementById("demo").innerHTML = d.toLocaleTimeString();
}
function start(){
   clearInterval(myVar);

   myVar= setInterval(myTimer ,1000);
}
start();
</script>

</body>
</html>
